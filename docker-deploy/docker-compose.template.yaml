name: ${BACKEND_COMPOSE_NAME:-backend-compose}
services:
  app:
    container_name: ${APP_CONTAINER_NAME}
    build:
      context: ../
      dockerfile: ./docker-deploy/Dockerfile
      args:
        - PYTHON_RELEASE
    ports:
      - ${PORT}:${PORT}
    restart: unless-stopped
    volumes:
      - ../.env:/app/.env:r
      - ./pg_backups:/app/pg_backups:r
      - images-volume:/app/images:rwo
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-internal
      - front-back

  db:
    container_name: ${DB_CONTAINER_NAME}
    image: postgres:${POSTGRES_RELEASE:-15.3-alpine}
    ports:
      - ${POSTGRES_PORT}:${POSTGRES_PORT}
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_HOST=0.0.0.0
      - POSTGRES_PORT
      - POSTGRES_DB
    healthcheck:
      test: pg_isready -d ${POSTGRES_DB} -U ${POSTGRES_USER}
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - ./pg_data:/var/lib/postgresql/data:rwo
      - ./pg_backups:/pg_backups:w
    networks:
      - backend-internal

# Создаем именованый volume, к которому потом подключимся из фронта
volumes:
  images-volume:
    name: ${IMAGES_VOLUME_NAME}
    driver: local
    driver_opts:
      type: none
      device: ../images
      o: bind

networks:
  backend-internal:
  front-back:
